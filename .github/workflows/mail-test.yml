name: Test email (mot de passe oublié)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse à laquelle envoyer le mail de test"
        default: "jeanbaptiste.kern@hibroye.ch"

permissions:
  contents: read
  issues: write

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un mail de réinitialisation et rapporter
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://docbingo.ch
          EMAIL: ${{ inputs.email }}
        run: |
          ST=$(curl -s -m 30 "$URL/api/auth/mail-status")
          R=$(curl -s -m 60 -w " [HTTP %{http_code}]" -X POST -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL\"}" "$URL/api/auth/forgot")
          BODY=$(printf '**Test email** (%s)\n\n- mail-status : `%s`\n- forgot(%s) : `%s`\n\n_Généré le %s_' "$URL" "$ST" "$EMAIL" "$R" "$(date -u +%FT%TZ)")
          echo "$BODY"
          gh issue comment -R ${{ github.repository }} 2 --body "$BODY"
