name: Statut de production

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier Render et l'application
        env:
          GH_TOKEN: ${{ github.token }}
          RK: ${{ secrets.RENDER_API_KEY }}
          PW: ${{ secrets.DOCBINGO_PASSWORD }}
        run: |
          set +e
          SVC=$(curl -sf -H "Authorization: Bearer $RK" "https://api.render.com/v1/services?limit=20&includePreviews=true" | jq -c '[.[] | .service | {id, name, type, url: .serviceDetails.url, region: .serviceDetails.region, plan: .serviceDetails.plan, autoDeploy, suspended, repo, branch, build: .serviceDetails.envSpecificDetails.buildCommand, start: .serviceDetails.envSpecificDetails.startCommand, publish: .serviceDetails.publishPath}]')
          ENVK=$(curl -s -H "Authorization: Bearer $RK" "https://api.render.com/v1/services/$(echo "$SVC" | jq -r '.[0].id')/env-vars?limit=20" | jq -c '[.[] | .envVar.key]')
          HDR=$(curl -s -D - -o /dev/null "$(echo "$SVC" | jq -r '.[0].url')/api/ping" | grep -i "^HTTP\|^server\|^x-render\|^content-type" | tr '\n' ' ')
          URL=$(echo "$SVC" | jq -r '.[] | select(.name=="docbingo") | .url // empty' | head -1)
          [ -z "$URL" ] && URL=$(echo "$SVC" | jq -r '.[0].url')
          SID=$(echo "$SVC" | jq -r '.[] | select(.url=="'"$URL"'") | .id')
          DEPLOY=$(curl -sf -H "Authorization: Bearer $RK" "https://api.render.com/v1/services/$SID/deploys?limit=3" | jq -c '[.[] | .deploy | {status, commit: .commit.message[0:40], finishedAt}]')
          PING=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/ping")
          LOGIN=$(curl -s -w " [%{http_code}]" -X POST -H "Content-Type: application/json" -d "{\"password\":\"$PW\"}" "$URL/api/login")
          TOKEN=$(echo "$LOGIN" | sed 's/ \[.*//' | jq -r '.token // empty')
          echo "::add-mask::$TOKEN"
          Q=$(curl -s -w " [%{http_code}]" -H "X-DocBingo-Token: $TOKEN" "$URL/api/questions"); NQ=$(echo "$Q" | sed 's/ \[.*//' | jq 'length' 2>/dev/null || echo "$Q" | tail -c 300)
          S=$(curl -s -w " [%{http_code}]" -H "X-DocBingo-Token: $TOKEN" "$URL/api/sessions"); NS=$(echo "$S" | sed 's/ \[.*//' | jq 'length' 2>/dev/null || echo "$S" | tail -c 300)
          HTML=$(curl -s -o /tmp/index.html -w "%{http_code}" "$URL/"); HTML="$HTML $(grep -o '<title>[^<]*' /tmp/index.html | head -1)"
          LOGS=$(curl -s -H "Authorization: Bearer $RK" "https://api.render.com/v1/logs?ownerId=$(echo "$SVC" | jq -r '.[0].id' | sed 's/srv-.*//')&resource=$SID&limit=25" | jq -r '.logs[]? | .message' 2>/dev/null | tail -25 | sed "s/$TOKEN/***/g" | head -c 2500)
          BODY=$(printf '**URL : %s**\n\nServices : `%s`\n\nEnv keys : `%s` · Headers ping : `%s`\n\nDéploiements : `%s`\n\nPing : %s · Login : `%s` · Page : `%s` · Questions : %s · Sessions : %s\n\nLogs récents :\n```\n%s\n```\n_Généré le %s_' "$URL" "$SVC" "$ENVK" "$HDR" "$DEPLOY" "$PING" "$(echo "$LOGIN" | sed 's/"token":"[^"]*"/"token":"***"/')" "$HTML" "$NQ" "$NS" "$LOGS" "$(date -u +%FT%TZ)")
          N=$(gh issue list --state open --search "Statut de production in:title" --json number --jq '.[0].number' -R ${{ github.repository }})
          if [ -z "$N" ]; then gh issue create -R ${{ github.repository }} --title "Statut de production" --body "$BODY"; else gh issue comment -R ${{ github.repository }} "$N" --body "$BODY"; fi
